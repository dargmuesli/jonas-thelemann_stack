secrets:
  postgres-password:
    # The database default user's password.
    file: ~~/artifacts/secrets/postgres-password.secret
  postgres-role-creal-postgraphile-password:
    # The `creal_postgraphile` database role's password.
    file: ~~/artifacts/secrets/postgres-role-creal-postgraphile-password.secret
  postgres-role-trapparty-postgraphile-password:
    # The `trapparty_postgraphile` database role's password.
    file: ~~/artifacts/secrets/postgres-role-trapparty-postgraphile-password.secret
  postgres-user:
    # The database default user's name.
    file: ~~/artifacts/secrets/postgres-user.secret
services:
  postgres:
    # You can access the database via `adminer`.
    deploy:
      labels:
        - dargstack.profiles=default,creal,trapparty,nextcloud,backup
    environment:
      POSTGRES_ADDITIONAL_DBS: creal creal_strapi hedgedoc nextcloud trapparty
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER_FILE: /run/secrets/postgres-user
    image: postgres:18.6-alpine
    secrets:
      - postgres-password
      - postgres-user
    volumes:
      - postgres-data:/var/lib/postgresql/
      - ./configurations/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/:ro
volumes:
  postgres-data:
    # The database's data.
    {}
x-dargstack:
  secrets:
    postgres-password:
      special_characters: false
      type: random_string
    postgres-role-creal-postgraphile-password:
      special_characters: false
      type: random_string
    postgres-role-trapparty-postgraphile-password:
      special_characters: false
      type: random_string
    postgres-user:
      type: wordlist_word
