services:
  adminer:
    # You can access the database's frontend at [adminer.localhost](https://adminer.localhost/).
    # This information is required for login:
    #
    # |          |                     |
    # | -------- | ------------------- |
    # | System   | PostgreSQL          |
    # | Server   | postgres            |
    # | Username | [postgres-user]     |
    # | Password | [postgres-password] |
    # | Database |                     |
    #
    # Values in square brackets are [Docker secrets](https://docs.docker.com/engine/swarm/secrets/).
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.adminer.middlewares=redirectscheme
        - traefik.http.routers.adminer.rule=Host(`adminer.${STACK_DOMAIN}`)
        - traefik.http.routers.adminer-secure.rule=Host(`adminer.${STACK_DOMAIN}`)
        - traefik.http.routers.adminer-secure.tls.options=mintls13@file # dargstack:dev-only
        - traefik.http.services.adminer.loadbalancer.server.port=8080
    image: adminer:5.5.0-standalone
    volumes:
      - ./configurations/adminer.css:/var/www/html/adminer.css:ro
