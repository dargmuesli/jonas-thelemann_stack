secrets:
  trapparty-postgraphile-connection:
    # The TrapParty GraphQL API's database URI.
    file: ~~/artifacts/secrets/trapparty-postgraphile-connection.secret
  trapparty-postgraphile-owner-connection:
    # The TrapParty GraphQL API's database owner URI.
    file: ~~/artifacts/secrets/trapparty-postgraphile-owner-connection.secret
services:
  trapparty-postgraphile:
    # You can access TrapParty's GraphQL API for the PostgreSQL database at [postgraphile.localhost](https://postgraphile.localhost/).
    deploy:
      labels:
        - dargstack.profiles=trapparty
        - traefik.enable=true
        - traefik.http.routers.trapparty-postgraphile.middlewares=redirectscheme
        - traefik.http.routers.trapparty-postgraphile.rule=Host(`trapparty-postgraphile.${STACK_DOMAIN}`)
        - traefik.http.routers.trapparty-postgraphile-secure.middlewares=header_cors # dargstack:dev-only
        - traefik.http.routers.trapparty-postgraphile-secure.rule=Host(`trapparty-postgraphile.${STACK_DOMAIN}`)
        - traefik.http.routers.trapparty-postgraphile-secure.tls.options=mintls13@file # dargstack:dev-only
        - traefik.http.services.trapparty-postgraphile.loadbalancer.server.port=5000
    environment:
      # The PostgreSQL schema exposed by the GraphQL API.
      POSTGRAPHILE_SCHEMA: trapparty
      # The role the GraphQL API uses for every request.
      POSTGRAPHILE_DEFAULT_ROLE: trapparty_anonymous
      # The HTTP port of the GraphQL API; must be a container environment variable because the healthcheck only reads the container environment.
      POSTGRAPHILE_PORT: 5000
    image: ghcr.io/maevsi/postgraphile:3.0.0-beta.3
    secrets:
      - source: trapparty-postgraphile-connection
        target: /run/environment-variables/POSTGRAPHILE_CONNECTION
      - source: trapparty-postgraphile-owner-connection
        target: /run/environment-variables/POSTGRAPHILE_OWNER_CONNECTION
x-dargstack:
  secrets:
    trapparty-postgraphile-connection:
      type: template
      template: postgresql://trapparty_postgraphile:{{secret:postgres-role-trapparty-postgraphile-password}}@postgres:5432/trapparty
    trapparty-postgraphile-owner-connection:
      type: template
      template: postgresql://{{secret:postgres-user}}:{{secret:postgres-password}}@postgres:5432/trapparty
