secrets:
  portainer-admin-password:
    # The container manager's password for the user `admin`.
    file: ~~/artifacts/secrets/portainer-admin-password.secret
services:
  portainer:
    # You can access the container manager's frontend at [portainer.localhost](https://portainer.localhost/).
    command: -H tcp://tasks.portainer-agent:9001 --tlsskipverify --admin-password-file '/run/secrets/portainer-admin-password'
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.middlewares=redirectscheme
        - traefik.http.routers.portainer.rule=Host(`portainer.${STACK_DOMAIN}`)
        - traefik.http.routers.portainer-secure.rule=Host(`portainer.${STACK_DOMAIN}`)
        - traefik.http.routers.portainer-secure.tls.options=mintls13@file # dargstack:dev-only
        - traefik.http.services.portainer.loadbalancer.server.port=9000
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      replicas: 1
    image: portainer/portainer-ce:2.43.0-alpine
    secrets:
      - portainer-admin-password
    volumes:
      - portainer-data:/data
  portainer-agent:
    # You can access the container manager agent via `portainer`.
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
    image: portainer/agent:2.43.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
volumes:
  portainer-data:
    # The container manager's data.
    {}
x-dargstack:
  secrets:
    portainer-admin-password:
      type: random_string
