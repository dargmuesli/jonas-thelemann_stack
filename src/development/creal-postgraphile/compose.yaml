secrets:
  creal-postgraphile-connection:
    # The cReal GraphQL API's database URI.
    file: ~~/artifacts/secrets/creal-postgraphile-connection.secret
  creal-postgraphile-owner-connection:
    # The cReal GraphQL API's database owner URI.
    file: ~~/artifacts/secrets/creal-postgraphile-owner-connection.secret
services:
  creal-postgraphile:
    # You can access cReal's GraphQL API for the PostgreSQL database at [creal-postgraphile.localhost](https://creal-postgraphile.localhost/).
    deploy:
      labels:
        - dargstack.profiles=creal
        - traefik.enable=true
        - traefik.http.routers.creal-postgraphile.middlewares=redirectscheme
        - traefik.http.routers.creal-postgraphile.rule=Host(`creal-postgraphile.${STACK_DOMAIN}`)
        - traefik.http.routers.creal-postgraphile-secure.middlewares=header_cors # dargstack:dev-only
        - traefik.http.routers.creal-postgraphile-secure.rule=Host(`creal-postgraphile.${STACK_DOMAIN}`)
        - traefik.http.routers.creal-postgraphile-secure.tls.options=mintls13@file # dargstack:dev-only
        - traefik.http.services.creal-postgraphile.loadbalancer.server.port=5000
    environment:
      # The PostgreSQL schema exposed by the GraphQL API.
      POSTGRAPHILE_SCHEMA: creal
      # The role the GraphQL API uses for every request.
      POSTGRAPHILE_DEFAULT_ROLE: creal_anonymous
      # The HTTP port of the GraphQL API; must be a container environment variable because the healthcheck only reads the container environment.
      POSTGRAPHILE_PORT: 5000
    image: ghcr.io/maevsi/postgraphile:3.0.0-beta.3
    secrets:
      - source: creal-postgraphile-connection
        target: /run/environment-variables/POSTGRAPHILE_CONNECTION
      - source: creal-postgraphile-owner-connection
        target: /run/environment-variables/POSTGRAPHILE_OWNER_CONNECTION
x-dargstack:
  secrets:
    creal-postgraphile-connection:
      type: template
      template: postgresql://creal_postgraphile:{{secret:postgres-role-creal-postgraphile-password}}@postgres:5432/creal
    creal-postgraphile-owner-connection:
      type: template
      template: postgresql://{{secret:postgres-user}}:{{secret:postgres-password}}@postgres:5432/creal
