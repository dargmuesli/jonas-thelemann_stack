secrets:
  creal-s3-access-key-id:
    # The DJ website's AWS access key id.
    file: ~~/artifacts/secrets/creal-s3-access-key-id.secret
  creal-s3-access-key-secret:
    # The DJ website's AWS access key.
    file: ~~/artifacts/secrets/creal-s3-access-key-secret.secret
  creal-sqitch-target:
    # The DJ website's Sqitch target.
    file: ~~/artifacts/secrets/creal-sqitch-target.secret
services:
  creal:
    # You can access the DJ website at [creal.localhost](https://creal.localhost/).
    deploy:
      labels:
        - dargstack.development.git.ssh=git@github.com:dargmuesli/creal.git
        - dargstack.development.git.https=https://github.com/dargmuesli/creal.git
        - traefik.enable=true
        - traefik.http.routers.creal.entryPoints=web
        - traefik.http.routers.creal.middlewares=redirectscheme
        - traefik.http.routers.creal.rule=Host(`creal.${STACK_DOMAIN}`)
        - traefik.http.routers.creal.service=creal # dargstack:dev-only
        - traefik.http.routers.creal-secure.entryPoints=web-secure
        - traefik.http.routers.creal-secure.rule=Host(`creal.${STACK_DOMAIN}`)
        - traefik.http.routers.creal-secure.tls.options=mintls13@file # dargstack:dev-only
        - traefik.http.routers.creal-secure.service=creal # dargstack:dev-only
        - traefik.http.routers.creal-secure-nuxt.entryPoints=nuxt # dargstack:dev-only
        - traefik.http.routers.creal-secure-nuxt.service=creal-secure-nuxt # dargstack:dev-only
        - traefik.http.routers.creal-secure-nuxt.rule=Host(`creal.${STACK_DOMAIN}`) # dargstack:dev-only
        - traefik.http.services.creal.loadbalancer.server.port=3000
        - traefik.http.services.creal-secure-nuxt.loadbalancer.server.port=24678 # dargstack:dev-only
    environment:
      NUXT_PUBLIC_CREAL_S3_BUCKET: ${CREAL_S3_BUCKET}
      NUXT_PUBLIC_CREAL_S3_ENDPOINT: ${CREAL_S3_ENDPOINT}
      NUXT_PUBLIC_CREAL_S3_REGION: ${CREAL_S3_REGION}
      NUXT_PUBLIC_GTAG_ID: ${GTAG_ID}
      NUXT_PUBLIC_I18N_BASE_URL: https://creal.${STACK_DOMAIN}
      NUXT_PUBLIC_SITE_URL: https://creal.${STACK_DOMAIN}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    image: dargmuesli/creal:dev
    secrets:
      - source: creal-s3-access-key-id
        target: /run/environment-variables/NUXT_CREAL_S3_ACCESS_KEY_ID
      - source: creal-s3-access-key-secret
        target: /run/environment-variables/NUXT_CREAL_S3_ACCESS_KEY_SECRET
      - creal-sqitch-target
      - source: jonas-thelemann-turnstile-key
        target: /run/environment-variables/NUXT_TURNSTILE_SECRET_KEY
      - postgres-role-creal-postgraphile-password
      - source: shared-nuxt-og-image-secret
        target: /run/environment-variables/NUXT_OG_IMAGE_SECRET
    volumes:
      - pnpm-data:/srv/.pnpm-store/ # dargstack:dev-only
      - ~~~/creal/:/srv/app/ # dargstack:dev-only
      - creal-data:/srv/app/node_modules # dargstack:dev-only
volumes:
  creal-data:
    # The DJ website's data.
    {}
x-dargstack:
  secrets:
    creal-s3-access-key-id:
      type: third_party
    creal-s3-access-key-secret:
      type: third_party
    creal-sqitch-target:
      type: template
      template: db:pg://{{secret:postgres-user}}:{{secret:postgres-password}}@postgres/creal
