secrets:
  shared-nuxt-app-secret:
    # The root secret of Nuxt websites, e.g. for signing Open Graph image URLs.
    file: ~~/artifacts/secrets/shared-nuxt-app-secret.secret
volumes:
  pnpm-data:
    # The node package manager's data.
    {}
x-dargstack:
  secrets:
    shared-nuxt-app-secret:
      special_characters: false # nitro parses environment overrides, so the value must stay a plain string
      type: random_string
