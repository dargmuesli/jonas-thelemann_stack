services:
  trapparty:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.trapparty-secure.middlewares=cloudflarewarp
        - traefik.http.routers.trapparty-secure.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/dargmuesli/trapparty:7.1.1@sha256:639a3892e604e20491395ff4b2885e657c4a53b47409ee86bcac92c958ed7936
    volumes: (( prune ))
