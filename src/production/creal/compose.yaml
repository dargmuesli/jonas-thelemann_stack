services:
  creal:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.creal-secure.middlewares=cloudflarewarp
        - traefik.http.routers.creal-secure.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/dargmuesli/creal:7.0.1
    volumes: (( prune ))
